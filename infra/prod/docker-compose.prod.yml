# Single-host production stack. Run via ./deploy.sh (or: docker compose --env-file .env.prod -f docker-compose.prod.yml up -d).
# Prereqs: .env.prod, ./pki (provision_domain_certs.sh), ../../frontend/build (deploy.sh builds it).
services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.prod}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${FRONTEND_BUILD_DIR:-../../frontend/build}:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      PORT: "8000"
      MONGO_URL: mongodb://mongo:27017
      MQTT_BROKER_URL: mqtts://mosquitto:8883
      MQTT_TLS_CA: /pki/ca.crt
      MQTT_CLIENT_CERT: /pki/cloud-consumer.crt
      MQTT_CLIENT_KEY: /pki/cloud-consumer.key
    volumes:
      - ./pki:/pki:ro
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 8
      start_period: 20s

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ../mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ../mqtt/acl.conf:/mosquitto/config/acl.conf:ro
      - ./pki/ca.crt:/mosquitto/certs/ca.crt:ro
      - ./pki/server.crt:/mosquitto/certs/server.crt:ro
      - ./pki/server.key:/mosquitto/certs/server.key:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -p 8883 --cafile /mosquitto/certs/ca.crt --cert /mosquitto/certs/server.crt --key /mosquitto/certs/server.key -t '$$SYS/broker/uptime' -C 1 -W 5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  caddy-data:
  caddy-config:
  mongo-data:
  mqtt-data:
