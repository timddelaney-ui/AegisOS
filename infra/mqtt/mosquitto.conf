# Aegis production MQTT broker (Eclipse Mosquitto 2.x). Mutual-TLS only; no plaintext listener.
per_listener_settings true
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
log_dest stdout
log_type error
log_type warning
log_type notice

listener 8883
protocol mqtt
allow_anonymous false
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# No tls_version pin: Mosquitto 2.x negotiates TLS 1.2 and 1.3 and alerts on TLS <= 1.1
# (verified with `openssl s_client -tls1_1`; see tests/infra/test_mqtt_broker.py).
require_certificate true
# The client certificate CN becomes the MQTT username used by the ACL file.
use_identity_as_username true
acl_file /mosquitto/config/acl.conf

# Persistent sessions and queued QoS1 acks must survive long rig blackouts.
max_queued_messages 100000
max_inflight_messages 100
message_size_limit 4194304
