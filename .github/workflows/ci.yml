name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Byte-compile backend
        run: python -m compileall -q backend

  edge-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install edge test dependencies
        run: python -m pip install pytest==9.1.1 pytest-xdist==3.8.0 paho-mqtt==2.1.0 mongomock-motor==0.0.36 pydantic pymongo motor pyyaml asyncua fastapi==0.137.0 httpx python-multipart
      - name: Test durable edge outbox
        run: pytest -q backend/tests/test_edge_gateway.py backend/tests/test_liveops_broadcast.py backend/tests/test_field_hardening.py backend/tests/test_edge_consensus.py backend/tests/test_mqtt_ingest.py backend/tests/test_multitenant_rbac_audit.py backend/tests/test_personal_wellbore.py tests/edge

  frontend-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: frontend
        run: corepack yarn install --ignore-scripts --non-interactive
      - name: Test wellbore geometry and responsive camera
        run: node --experimental-vm-modules --test tests/frontend/wellboreGeometry.test.mjs
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: "true"
        run: corepack yarn test --watchAll=false --runInBand
      - name: Build frontend
        working-directory: frontend
        run: corepack yarn build
